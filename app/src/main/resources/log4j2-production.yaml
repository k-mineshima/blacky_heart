Configuration:
  Properties:
    property:
      - name: "file_format"
        value: "%d{yyyy-MM-dd HH:mm:ss.SSS}{GMT+9} %-5level %c - %m%n"
      - name: "basedir"
        value: "logs"
  Appenders:
    RollingFile:
      name: "daily_rolling_file"
      fileName: "${basedir}/application.log"
      filePattern: "${basedir}/application-%d{yyyy-MM-dd}.log.gz"
      PatternLayout:
        pattern: "${file_format}"
      Policies:
        TimeBasedTriggeringPolicy:
          interval: 1
          modulate: true
    File:
      name: "error_file"
      fileName: "${basedir}/errors.log"
      PatternLayout:
        pattern: "${file_format}"
  Loggers:
    Root:
      level: "info"
      AppenderRef:
        - ref: "daily_rolling_file"
    Logger:
      - name: "com.fionn.blacky_heart"
        level: "error"
        AppenderRef:
          - ref: "error_file"
